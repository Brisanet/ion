<section>
  <h2>Smart Table</h2>
  <div style="display: flex; flex-direction: column; gap: 20px">
    <ion-smart-table
      [config]="smartTableConfig"
      (events)="smartTableEvents($event)"
    ></ion-smart-table>
  </div>

  <ng-template #quantityTemplate let-row>
    <ion-input-counter
      [count]="row.quantity"
      inputSize="sm"
      (changedValue)="row.quantity = $event.newValue"
    ></ion-input-counter>
  </ng-template>
</section>
