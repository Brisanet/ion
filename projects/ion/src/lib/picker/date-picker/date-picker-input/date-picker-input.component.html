@switch (activeLayout()) {
  @case ('joined') {
    <div
      class="input-wrapper layout-joined"
      [class.disabled]="disabled()"
      [class.size-large]="size() === 'large'"
      [class.theme-secondary]="theme() === 'secondary'"
      [class.invalid]="joinedInvalid()"
      [class.valid]="joinedValid()"
      [attr.aria-invalid]="startInvalid() || null"
      data-testid="date-picker-input-joined"
    >
      <ion-input
        [size]="size()"
        [theme]="theme()"
        [value]="startDate()"
        [class.invalid]="startInvalid()"
        [class.valid]="startValid()"
        [attr.aria-invalid]="startInvalid() || null"
        [placeholder]="startPlaceholder()"
        [iconInput]="hasDate() ? '' : 'calendar'"
        iconDirection="left"
        [readonly]="true"
        [disabled]="disabled()"
      ></ion-input>

        <span class="joined-divider" aria-hidden="true">–</span>

      <ion-input
        [size]="size()"
        [theme]="theme()"
        [value]="endDate()"
        [class.invalid]="endInvalid()"
        [class.valid]="endValid()"
        [attr.aria-invalid]="endInvalid() || null"
        [inputButton]="hasDate()"
        [placeholder]="endPlaceholder()"
        [inputButtonConfig]="clearButtonConfig()"
        [readonly]="true"
        [disabled]="disabled()"
        (clickButton)="clearDateValue()"
      ></ion-input>
    </div>
  }

  @case ('split') {
    <div
      class="input-wrapper layout-split"
      [class.disabled]="disabled()"
      [class.size-large]="size() === 'large'"
      [class.theme-secondary]="theme() === 'secondary'"
      data-testid="date-picker-input-split"
    >
      <ion-input
        [size]="size()"
        [theme]="theme()"
        [value]="startDate()"
        [class.invalid]="startInvalid()"
        [class.valid]="startValid()"
        [attr.aria-invalid]="startInvalid() || null"
        [placeholder]="startPlaceholder()"
        [iconInput]="hasDate() ? '' : 'calendar'"
        iconDirection="left"
        [readonly]="true"
        [disabled]="disabled()"
      ></ion-input>

      <span class="split-separator" aria-hidden="true">–</span>

      <ion-input
        [size]="size()"
        [theme]="theme()"
        [value]="endDate()"
        [class.invalid]="endInvalid()"
        [class.valid]="endValid()"
        [attr.aria-invalid]="endInvalid() || null"
        [placeholder]="endPlaceholder()"
        [iconInput]="hasDate() ? '' : 'calendar'"
        iconDirection="left"
        [inputButton]="hasDate()"
        [inputButtonConfig]="clearButtonConfig()"
        [readonly]="true"
        [disabled]="disabled()"
        (clickButton)="clearDateValue()"
      ></ion-input>
    </div>
  }

  @default {
    <div
      class="container-input"
      [class.range]="rangePicker()"
      [class.theme-secondary]="theme() === 'secondary'"
      data-testid="container-input"
    >
      <ion-input
        data-testid="date-picker-input-element"
        [size]="size()"
        [theme]="theme()"
        [value]="singleInputValue()"
        [placeholder]="startPlaceholder()"
        [iconInput]="hasDate() ? '' : 'calendar'"
        iconDirection="right"
        [inputButton]="hasDate()"
        [inputButtonConfig]="clearButtonConfig()"
        [class.invalid]="startInvalid()"
        [class.valid]="startValid()"
        [attr.aria-invalid]="startInvalid() || null"
        [readonly]="true"
        [disabled]="disabled()"
        (clickButton)="clearDateValue()"
      ></ion-input>
    </div>
  }
}
